@if (auth.session()?.role === 'Administrador') {
  <section class="dashboard">
    <header class="encabezado-dashboard">
      <span class="etiqueta">REBUILD AI · ADMINISTRACIÓN</span>
      <h1>Dashboard de reportes</h1>
      <p>
        Consulta la distribución de productos y usuarios de la plataforma.
      </p>
    </header>

    <div class="cuadricula">
      <app-report01component></app-report01component>
      <app-report02component></app-report02component>
    </div>
  </section>
} @else {
  <section class="sin-acceso">
    <h1>Acceso restringido</h1>
    <p>Estos reportes están disponibles para administradores.</p>
  </section>
}
