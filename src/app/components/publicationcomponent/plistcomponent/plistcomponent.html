
<div class="container">
  <h2>Listado de publicaciones</h2>

  <table mat-table [dataSource]="publicaciones">

    <!-- Columna ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let p">{{ p.id }}</td>
    </ng-container>

    <!-- Columna Título -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let p">{{ p.title }}</td>
    </ng-container>

    <!-- Columna Operación -->
    <ng-container matColumnDef="operationType">
      <th mat-header-cell *matHeaderCellDef>Operación</th>
      <td mat-cell *matCellDef="let p">{{ p.operationType }}</td>
    </ng-container>

    <!-- Columna Estado -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let p">{{ p.status }}</td>
    </ng-container>

    <!-- Columna Producto -->
    <ng-container matColumnDef="productId">
      <th mat-header-cell *matHeaderCellDef>Producto</th>
      <td mat-cell *matCellDef="let p">{{ p.productId }}</td>
    </ng-container>

    <!-- Columna Ubicación -->
    <ng-container matColumnDef="locationId">
      <th mat-header-cell *matHeaderCellDef>Ubicación</th>
      <td mat-cell *matCellDef="let p">{{ p.locationId }}</td>
    </ng-container>

    <!-- Columna Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>

      <td mat-cell *matCellDef="let p">
        <button matButton (click)="editar(p.id)">
          Editar
        </button>

        <button matButton (click)="eliminar(p.id)">
          Eliminar
        </button>
      </td>
    </ng-container>

    <!-- Filas de la tabla -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>
</div>
